<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Plan: a private, zero-based budget. Give every dollar a job."
    />
    <!-- Installable web app ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="theme-color"
      content="#F3F4F9"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0E111C"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Plan" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* --app-height: the real screen height, set by src/utils/webSetup.ts in the iPhone Home Screen app. */
      html,
      body {
        height: var(--app-height, 100%);
        min-height: 100dvh;
        margin: 0;
        background-color: #f3f4f9;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: var(--app-height, 100%);
        min-height: 100dvh;
        flex: 1;
        background-color: #f3f4f9;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #0e111c;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
